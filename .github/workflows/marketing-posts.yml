name: One-off marketing posts

# Publishes the Aug 14, 2026 marketing package (2 image posts) to LinkedIn
# and Threads. Triggered by pushing the package script on its branch, or
# manually via workflow_dispatch. Dedupe log makes re-runs safe.

on:
  push:
    branches:
      - cursor/marketing-post-package-8f66
    paths:
      - scripts/social/post_marketing_package.py
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show what would post, post nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: marketing-posts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Publish marketing package
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_BUSINESS_ID: ${{ secrets.META_IG_BUSINESS_ID }}
          META_THREADS_USER_TOKEN: ${{ secrets.META_THREADS_USER_TOKEN }}
          META_THREADS_USER_ID: ${{ secrets.META_THREADS_USER_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          python3 scripts/social/post_marketing_package.py $ARGS

      - name: Commit posted log (double-post guard)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "palm-social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f scripts/social/.marketing_posted.json || true
          if ! git diff --cached --quiet; then
            git commit -m "social: record marketing package posted log [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
