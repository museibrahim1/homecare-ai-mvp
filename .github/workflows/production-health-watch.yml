name: Production health watch

# Polls production health, CI failures, and Railway logs every 10 minutes on
# weekdays. The Python script gates alerts to Mon–Fri 6 AM–9 PM US Eastern.
# Emails Muse when something new breaks; does not auto-fix.

on:
  schedule:
    - cron: "*/10 * * * 1-5"
  workflow_dispatch:
    inputs:
      force_hours:
        description: "Run even outside 6 AM–9 PM ET window"
        type: boolean
        default: false
      send:
        description: "Send alert email (use false for dry run)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: production-health-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Check production health
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          HEALTH_ALERT_TO: museibrahim@palmtai.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -q python-dotenv
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.send }}" = "true" ]; then
              ARGS="--send"
            fi
            if [ "${{ github.event.inputs.force_hours }}" = "true" ]; then
              ARGS="$ARGS --force-hours"
            fi
          else
            ARGS="--send"
          fi
          python scripts/monitoring/watch_production_health.py $ARGS

      - name: Commit alert state (dedupe guard)
        run: |
          git config user.name "palm-health-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f scripts/monitoring/.health_watch_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "monitoring: update health watch state [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
