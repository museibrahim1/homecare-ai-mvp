name: Platform info email engagement watch

# Polls Resend for tracked platform_info emails and emails Muse on first open/click.
# Needs scripts/email/.platform_info_sends.json committed on the branch.
# Commits alerted_events back so we do not re-alert every 15 minutes.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: platform-info-email-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Poll engagement
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          pip install -q python-dotenv requests
          if [ ! -f scripts/email/.platform_info_sends.json ]; then
            echo "No track log on branch yet — skipping"
            exit 0
          fi
          python scripts/email/watch_platform_info_engagement.py --once
      - name: Commit alert state (first-open guard)
        run: |
          git config user.name "palm-email-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f scripts/email/.platform_info_sends.json scripts/email/.platform_info_watch_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "email: record platform_info engagement alerts [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
