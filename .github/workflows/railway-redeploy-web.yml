name: Railway redeploy web

# Pulls latest main into the Railway web service.
# Use when GitHub→Railway auto-deploy does not fire after a merge.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Optional commit SHA (defaults to latest connected branch HEAD)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "scripts/deploy/railway_deploy_web.py"
      - "scripts/deploy/.redeploy-web"
      - ".github/workflows/railway-redeploy-web.yml"

permissions:
  contents: read

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Deploy web from latest GitHub commit
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          DEPLOY_COMMIT_SHA: ${{ github.event.inputs.commit_sha || github.sha }}
        run: python scripts/deploy/railway_deploy_web.py
