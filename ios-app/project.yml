name: PalmCareAI
options:
  bundleIdPrefix: com.palmcare
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "18"

targets:
  PalmCareAI:
    type: application
    platform: iOS
    sources:
      - path: PalmCareAI
        excludes:
          - "Resources/**"
    resources:
      - path: PalmCareAI/Resources
        buildPhase: resources
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        INFOPLIST_FILE: PalmCareAI/Info.plist
        CODE_SIGN_ENTITLEMENTS: PalmCareAI/PalmCareAI.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.palmcareai.app
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: BM5U63WP92
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone-only for v1.0. Must live at the TARGET level: xcodegen emits
        # TARGETED_DEVICE_FAMILY "1,2" on the target for iOS apps, which would
        # override a project-level setting and make the binary universal
        # (that's what triggered Apple's iPad screenshot requirement).
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: PalmCareAI/Info.plist
      properties:
        CFBundleName: PalmCareAI
        CFBundleDisplayName: PALM
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundlePackageType: APPL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Portrait-only iPhone app: required so App Store validation does not
        # demand iPad multitasking orientations (ITMS-90474).
        UIRequiresFullScreen: true
        # Background audio is required so visit recordings continue when the
        # screen locks or another app is foregrounded mid-assessment.
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "PALM uses the microphone to record client visits and assessments. Recording continues in the background only while a visit is in progress, and audio is processed solely for transcription, billing, and contract generation."
        NSFaceIDUsageDescription: "PALM uses Face ID to quickly and securely unlock the app and protect access to sensitive client information."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            railway.app:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: false
        ITSAppUsesNonExemptEncryption: false
        # Backend base URL. Empty falls back to the production Railway URL
        # in code, so this can be overridden by a build configuration.
        API_BASE_URL: ""
        DEMO_EMAIL: "demo@agency.com"
        # PostHog (optional override). If empty, app falls back to defaults.
        POSTHOG_API_KEY: ""
        POSTHOG_HOST: "https://us.i.posthog.com"
        # Google OAuth web client ID for Calendar/Gmail/Drive integrations.
        GOOGLE_CLIENT_ID: "668945369325-lrmdd9q1d6m7ggojiqvporj8frqso31j.apps.googleusercontent.com"
        # Google Sign-In iOS OAuth client (identity login). Distinct from web client.
        GOOGLE_IOS_CLIENT_ID: "668945369325-dm2uj3qs8hjhgl7nu9beoihghb8d4mq7.apps.googleusercontent.com"
        # URL schemes: app deep link + reversed client IDs for Google redirects.
        CFBundleURLTypes:
          - CFBundleURLName: com.palmcareai.app
            CFBundleURLSchemes:
              - com.palmcareai.app
              - com.googleusercontent.apps.668945369325-dm2uj3qs8hjhgl7nu9beoihghb8d4mq7
              - com.googleusercontent.apps.668945369325-lrmdd9q1d6m7ggojiqvporj8frqso31j

schemes:
  PalmCareAI:
    build:
      targets:
        PalmCareAI: all
    run:
      config: Debug
    archive:
      config: Release
